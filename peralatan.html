<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar peralatan SIPERALAB">
  <title>SIPERALAB | Peralatan</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/">SIPERALAB</a>

    <nav aria-label="Navigasi utama">
      <a href="/">Beranda</a>
      <a href="/peralatan.html">Peralatan</a>
      <a href="/peminjaman.html">Ajukan Peminjaman</a>
    </nav>
  </header>

  <main>
    <h1>Katalog Peralatan</h1>

    <section aria-labelledby="judul-katalog">
      <h2 id="judul-katalog">Peralatan yang dapat dipinjam</h2>

      <div class="equipment-list">
        <article class="equipment-card">
          <h3>Multimeter Digital</h3>

          <figure>
          <img
            src="/Images/multimeter.jpg"
            alt="Multimeter digital untuk pengukuran listrik"
            width="320"
          >
          <figcaption>
            Alat ukur tegangan, arus, dan resistansi
          </figcaption>
          </figure>

          <div class="equipment-meta">
            <span><strong>Stok:</strong> 6 unit</span>
            <span class="equipment-status">Kondisi: Baik</span>
          </div>
        </article>

        <article class="equipment-card">
        <h3>Router</h3>

        <figure>
          <img
            src="/Images/router.jpg"
            alt="Router jaringan untuk praktikum konfigurasi jaringan"
            width="320"
          >
          <figcaption>
            Perangkat jaringan untuk latihan routing dan konektivitas
          </figcaption>
        </figure>

        <div class="equipment-meta">
          <span><strong>Stok:</strong> 12 unit</span>
          <span class="equipment-status">Kondisi: Baik</span>
        </div>
        </article>

        <article class="equipment-card">
        <h3>Kamera</h3>

        <figure>
          <img
            src="/Images/kamera.jpg"
            alt="Kamera digital untuk dokumentasi kegiatan laboratorium"
            width="320"
          >
          <figcaption>
            Kamera digital untuk dokumentasi dan kebutuhan praktikum
          </figcaption>
        </figure>

        <div class="equipment-meta">
          <span><strong>Stok:</strong> 5 unit</span>
          <span class="equipment-status">Kondisi: Baik</span>
        </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      <a href="/peminjaman.html">Lanjut ke formulir peminjaman</a>
    </p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
